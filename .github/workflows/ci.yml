name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # D-27 recurrence guard. GitHub does not run an unparsable workflow and
  # does not surface a check for it: ci.yml and nightly.yml were invalid
  # YAML since the repo was reinitialised (commit e62c8d8), so every gate
  # below silently never executed. This job must stay cheap, dependency-light
  # and free of Docker/Rust/toolchain setup so it always reports.
  # ---------------------------------------------------------------------
  workflow-lint:
    name: Workflow YAML guard — D-27 recurrence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6"

      - name: Validate workflow YAML
        run: python scripts/ci/check_workflow_yaml.py

  # ---------------------------------------------------------------------
  # D-03: every env key the Rust API reads literally must appear in
  # .env.example. Note the known-unbounded source reported by the script:
  # crates/application/src/services/system_flags_service.rs consumes all of
  # env::vars() dynamically, so it contributes no enumerable key set.
  # ---------------------------------------------------------------------
  env-documentation:
    name: Env var documentation subset — D-03
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Rust env reads are documented
        run: python scripts/ci/check_env_documentation.py

  # ---------------------------------------------------------------------
  # D-35: tools/ortools_wasm/upstream-manifest.json (pinned build input) and
  # frontend/vendor/ortools/active-manifest.json (the only manifest tracked in
  # git, and the first file the browser fetches) must declare the same
  # artifact_version. A mismatch means a release was built locally and never
  # published. Its own job so the failing check is named precisely.
  # ---------------------------------------------------------------------
  ortools-release-consistency:
    name: OR-Tools wasm release consistency — D-35
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare upstream and active vendored manifests
        run: python scripts/ci/check_ortools_manifest.py

  # ---------------------------------------------------------------------
  # D-09: the numbered chain in migrations/ must apply to a clean database.
  # Throwaway Postgres via a service container (destroyed with the job), so
  # ordering gaps and missing prerequisites cannot hide behind local state.
  # ---------------------------------------------------------------------
  migrations-clean-install:
    name: Migrations — clean install (sqlx migrate) — D-09
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:ci_throwaway_pg_password@localhost:5432/fms_migrations_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_throwaway_pg_password
          POSTGRES_DB: fms_migrations_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fms_migrations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli (Postgres only)
        run: cargo install sqlx-cli --no-default-features --features postgres --locked --version 0.8.6

      # Repaired 2026-09-03: 155's remap whitelist previously omitted
      # dispatch_lock_rules (created with a flight_id column by migrations/053),
      # so `sqlx migrate run` aborted after 0..154 with
      #   "F3 apply refused: table public.dispatch_lock_rules with flight_id
      #    is not in remap whitelist"
      # dispatch_lock_rules is now remapped to the inbound leg like the other
      # dispatch-domain tables. This job is expected GREEN; if it goes red
      # again, the refusal is a real schema drift, not a harness problem.
      - name: Inspect migration set before applying
        # sqlx-cli 0.8 has no `migrate validate` subcommand. The empty-database
        # `run` below is the authoritative syntax/order/prerequisite check;
        # `info` here confirms discovery and current pending state.
        run: sqlx migrate info

      - name: Apply migrations to an empty database
        run: |
          set -euo pipefail
          sqlx migrate run
          sqlx migrate info

      - name: Assert the whole chain is applied
        run: |
          set -euo pipefail
          files=$(find migrations -maxdepth 1 -name '*.sql' | wc -l)
          applied=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM _sqlx_migrations")
          top=$(psql "$DATABASE_URL" -tAc "SELECT max(version) FROM _sqlx_migrations")
          echo "files: $files, applied rows: $applied, highest version: $top"
          if [ "$applied" != "$files" ]; then
            echo "::error::only $applied of $files migration files are recorded in _sqlx_migrations"
            exit 1
          fi
          if [ "$top" != "158" ]; then
            echo "::error::_sqlx_migrations highest version is $top, expected 158"
            exit 1
          fi

      - name: Assert re-running is a no-op (resumable / idempotent)
        run: |
          set -euo pipefail
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM _sqlx_migrations")
          sqlx migrate run
          after=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM _sqlx_migrations")
          [ "$before" = "$after" ] || { echo "::error::second run applied more migrations ($before -> $after)"; exit 1; }

  rust-api:
    name: Rust API — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/api-server/target
          key: ${{ runner.os }}-rust-api-${{ hashFiles('services/api-server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-api-

      - name: Format check
        run: cargo fmt -p fms-domain -p fms-runtime -p fms-application -p fms-infrastructure -p fms-api -p fms-server -p fms-benches -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        # These advisories are transitive through the pinned Flowable,
        # RocketMQ and Actix stacks (plus sqlx's cross-database drivers) and
        # cannot be upgraded independently without breaking their public APIs.
        # Keep the exceptions explicit until upstream releases compatible
        # fixed versions.
        run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2024-0363
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
          --ignore RUSTSEC-2026-0258
          --ignore RUSTSEC-2026-0185

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Deny check (advisories, licenses, bans, sources)
        # deny.toml lives at the repository root only; this job's default
        # working-directory is services/api-server. cargo-deny does search
        # ancestor directories, but relying on that discovery is exactly what
        # made D-10 ambiguous, so the policy path is passed explicitly.
        run: cargo deny --config ../../deny.toml check

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Seed Criterion baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          src = Path("benches/criterion-baseline")
          dst = Path("target/criterion")
          for estimates in src.glob("*/new/estimates.json"):
              name = estimates.parent.parent.name
              out = dst / name / "base"
              out.mkdir(parents=True, exist_ok=True)
              shutil.copy2(estimates, out / "estimates.json")
          PY

      - name: Run performance benchmarks
        run: cargo bench -p fms-benches --bench simd_json_benchmarks -- --baseline base

      - name: Validate benchmark regression
        working-directory: .
        run: |
          python scripts/validate_performance_regression.py \
            --baseline services/api-server/benches/criterion-baseline \
            --current services/api-server/target/criterion \
            --output services/api-server/performance_validation.json
          python - <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path("services/api-server/performance_validation.json").read_text())
          print(report)
          if report.get("recommendation") == "BLOCKED":
              sys.exit(1)
          PY

      - name: Architecture boundary guard
        run: |
          cargo test -p fms-api --test layer_boundary_guard
          cargo test -p fms-application --test application_boundary_inventory

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: rust-api-coverage
          path: services/api-server/lcov.info

  mq-gateway:
    name: MQ Gateway — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mq-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/mq-gateway/target
          key: ${{ runner.os }}-mq-gw-${{ hashFiles('services/mq-gateway/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-mq-gw-

      - name: Format check
        run: cargo fmt -p fms-mq-gateway -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        # See the MQ gateway audit step for the upstream transitive
        # dependency rationale. The same RocketMQ/Actix graph is used here.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0258
          --ignore RUSTSEC-2026-0185

      - name: Build
        run: cargo build --release --features rocketmq-backend

      - name: Test
        run: cargo test --features rocketmq-backend

  python-sidecar:
    name: Python AI Sidecar — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          # Use the committed lockfile so CI exercises the same dependency
          # graph as local development.  This includes pytest-asyncio and the
          # runtime modules imported by the sidecar suite; installing only
          # standalone tools leaves a clean runner unable to collect tests.
          uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run ruff check src

      - name: Ruff format check
        run: uv run ruff format --check src

      - name: Mypy
        # The sidecar contains a large legacy surface that is not yet typed
        # (tracked as an explicit technical-debt item). Keep CI honest with a
        # deterministic typed smoke set while Ruff/pytest cover the complete
        # runtime tree; expand this list as modules are migrated.
        run: >-
          uv run mypy --config-file /dev/null --follow-imports=skip
          src/application/services/ai/llm_eval_constants.py
          src/application/services/ai/feature_flags.py
          src/application/services/ai/compat.py
          src/application/services/ai/llm_eval_service/gates.py
          src/application/services/ai/llm_eval_service/models.py

      - name: Test
        run: uv run python -m pytest tests/sidecar -v --tb=short

  golden-tests:
    name: Golden Tests — validate AI query behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal dependencies for golden test validation (no external services required)
          pip install numpy pydantic

      - name: Run golden test structural validation (MOCK mode)
        run: |
          cd scripts
          python agent_validator.py --mode MOCK

  repository-meta-tests:
    name: Repository meta-tests — tests/tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # D-24: this step used to enumerate 10 of the 20 meta-test modules, so
      # every module added afterwards was silently unrun. The whole directory
      # is collected instead; all of them are hermetic (static source/SQL
      # scanning, or a subprocess against an in-process 127.0.0.1:0 test
      # server) and need no live service, database or outbound network.
      - name: Run all repository meta-tests
        run: python -m pytest tests/tools -q

  vue-frontend:
    name: Vue Frontend — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/vue-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker-compose-validate:
    name: Compose — validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate distributed compose
        run: docker compose -f deploy/docker/docker-compose.distributed.yml config --quiet
        env:
          DB_REPLICATION_PASSWORD: rep_ci_password
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          FMS_RUNTIME_ENV_FILE: /dev/null
          VAULT_RENDERED_ENV_FILE: /dev/null

  integration-test:
    name: Integration — PG / Redis / RocketMQ contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Start integration stack (PG + Redis + RocketMQ + mq-gateway)
        run: |
          docker compose -f deploy/docker/docker-compose.distributed.yml \
            -f deploy/docker/docker-compose.integration.yml \
            up -d --wait postgres redis rocketmq-namesrv rocketmq-broker mq-gateway
        env:
          DB_USER: postgres
          DB_PASSWORD: ci_explicit_db_password_not_for_prod
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          DB_NAME: flight_monitor_dev
          DB_REPLICATION_PASSWORD: rep_ci_password
          REDIS_PASSWORD: redis_ci_password
          FMS_RUNTIME_ENV_FILE: /dev/null
          VAULT_RENDERED_ENV_FILE: /dev/null

      - name: Run infrastructure integration tests
        working-directory: services/api-server
        env:
          DATABASE_URL: postgresql://postgres:ci_explicit_db_password_not_for_prod@localhost:5432/flight_monitor_dev
          TEST_DATABASE_URL: postgresql://postgres:ci_explicit_db_password_not_for_prod@localhost:5432/flight_monitor_dev
          REDIS_URL: redis://default:redis_ci_password@localhost:6379
          ROCKETMQ_NAME_SERVER_ADDR: localhost:9876
        run: cargo test -p fms-infrastructure

      - name: Run mq-gateway RocketMQ contract tests
        working-directory: services/mq-gateway
        env:
          ROCKETMQ_NAME_SERVER_ADDR: localhost:9876
          MQ_GATEWAY_URL: http://localhost:8097
        run: cargo test --features rocketmq-backend

      - name: Capture integration stack diagnostics
        if: failure()
        run: |
          docker compose -f deploy/docker/docker-compose.distributed.yml \
            -f deploy/docker/docker-compose.integration.yml ps -a
          docker compose -f deploy/docker/docker-compose.distributed.yml \
            -f deploy/docker/docker-compose.integration.yml logs --no-color \
            rocketmq-namesrv rocketmq-namesrv-2 rocketmq-broker mq-gateway
        env:
          DB_USER: postgres
          DB_PASSWORD: ci_explicit_db_password_not_for_prod
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          DB_NAME: flight_monitor_dev
          DB_REPLICATION_PASSWORD: rep_ci_password
          REDIS_PASSWORD: redis_ci_password
          FMS_RUNTIME_ENV_FILE: /dev/null
          VAULT_RENDERED_ENV_FILE: /dev/null

      - name: Tear down stack
        if: always()
        run: |
          docker compose -f deploy/docker/docker-compose.distributed.yml \
            -f deploy/docker/docker-compose.integration.yml down -v
        env:
          DB_USER: postgres
          DB_PASSWORD: ci_explicit_db_password_not_for_prod
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          DB_NAME: flight_monitor_dev
          DB_REPLICATION_PASSWORD: rep_ci_password
          REDIS_PASSWORD: redis_ci_password
          FMS_RUNTIME_ENV_FILE: /dev/null
          VAULT_RENDERED_ENV_FILE: /dev/null

  e2e-integration:
    name: E2E — Playwright against running stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # D-26: this job used to carry `continue-on-error: true`, so a broken
    # full-stack E2E run could never block a merge, while the vue-frontend job
    # already ran Playwright unguarded (and tests/tools asserts
    # `continue-on-error` is absent there). Nothing had `needs:
    # e2e-integration`, so the soft-fail guarded no dependency. If this job
    # proves flaky, fix or quarantine the individual spec -- do not re-add a
    # job-level soft-fail.
    defaults:
      run:
        working-directory: frontend/vue-app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/vue-app/package-lock.json

      - name: Build Rust API (release)
        working-directory: services/api-server
        run: cargo build --release

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Generate minimal runtime env for stack
        run: |
          cat > "${{ github.workspace }}/ci_runtime.env" <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=flight_monitor_dev
          DB_REPLICATION_PASSWORD=rep_ci_password
          REDIS_PASSWORD=redis_ci_password
          TRUSTED_PROXY_CIDRS=127.0.0.1/32
          EOF

      - name: Bring up full stack (integration override exposes rust-api on :18443)
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f deploy/docker/docker-compose.distributed.yml \
            -f deploy/docker/docker-compose.integration.yml up -d --wait
        env:
          DB_USER: postgres
          DB_PASSWORD: ci_explicit_db_password_not_for_prod
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          DB_NAME: flight_monitor_dev
          DB_REPLICATION_PASSWORD: rep_ci_password
          REDIS_PASSWORD: redis_ci_password
          FMS_RUNTIME_ENV_FILE: ${{ github.workspace }}/ci_runtime.env
          VAULT_RENDERED_ENV_FILE: ${{ github.workspace }}/ci_runtime.env

      - name: Playwright E2E
        run: npx playwright test
        env:
          BASE_URL: http://localhost:18443

      - name: Tear down stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f deploy/docker/docker-compose.distributed.yml \
            -f deploy/docker/docker-compose.integration.yml down -v
        env:
          DB_USER: postgres
          DB_PASSWORD: ci_explicit_db_password_not_for_prod
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          DB_NAME: flight_monitor_dev
          DB_REPLICATION_PASSWORD: rep_ci_password
          REDIS_PASSWORD: redis_ci_password
          FMS_RUNTIME_ENV_FILE: ${{ github.workspace }}/ci_runtime.env
          VAULT_RENDERED_ENV_FILE: ${{ github.workspace }}/ci_runtime.env
