name: CI - Rust API Performance Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # ============================================================
  # Job 1: Code Quality Checks
  # ============================================================
  quality-checks:
    name: Code Quality & Safety
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Format check
        run: cargo fmt -- --check
        
      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings
        
      - name: Security audit
        run: cargo audit
        
  # ============================================================
  # Job 2: Build & Unit Tests
  # ============================================================
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    
    needs: quality-checks
    outputs:
      benchmark_baseline_path: ${{ steps.baseline.outputs.benchmark_baseline_path }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup environment variables
        run: echo "DATABASE_URL=postgres://user:pass@localhost/fms" >> $GITHUB_ENV
      
      - name: Build API server
        working-directory: services/api-server
        run: cargo build --release
      
      - name: Run unit tests
        working-directory: services/api-server
        run: cargo test --lib --bins
      
      - name: Upload binary artifact
        # v4 semantics: names must be unique per workflow run (v3 overwrote
        # duplicates), and the artifact root is the matched file's directory
        # rather than the full `path` prefix. Both hold for these names, and
        # `performance-gate` below consumes them by name.
        uses: actions/upload-artifact@v4
        with:
          name: fms-api-binary
          path: services/api-server/target/release/fms-server
          if-no-files-found: error
      
      # ============================================================
      # Step: Capture Performance Baseline (NEW!)
      # ============================================================
      - name: Capture performance baseline
        id: baseline
        working-directory: services/api-server
        run: |
          mkdir -p artifacts/benchmarks
          cargo bench -p fms-benches --bench repository_benchmarks -- --save-baseline baseline
          
          # Save baseline file reference
          BASELINE_PATH=$(pwd)/artifacts/benchmarks/baseline.json
          echo "benchmark_baseline_path=$BASELINE_PATH" >> $GITHUB_OUTPUT
          echo "Baseline captured at: $BASELINE_PATH"
        
        continue-on-error: true  # Baseline capture is optional
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: steps.baseline.outcome == 'success'
        with:
          name: benchmark-results
          path: services/api-server/artifacts/benchmarks/
  
  # ============================================================
  # Job 3: Performance Regression Gate (NEW!)
  # ============================================================
  performance-gate:
    name: Performance Regression Gate
    runs-on: ubuntu-latest
    needs: [build-and-test]
    
    # Only run on PRs to main branch or manual trigger
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      # v3 downloaders cannot reliably see artifacts written by v4 uploaders,
      # so producer and consumer were moved to v4 together.
      #
      # Pre-existing flaw, left as-is deliberately (out of scope for a version
      # bump): the `benchmark-results` upload is conditional on the optional
      # baseline step succeeding, while these downloads are unconditional -- so
      # if baseline capture fails, this job now fails here. They are also dead
      # weight: the validation step below reads `benches/criterion-baseline`
      # and `target/criterion`, not `artifacts/benchmarks/`. Fixing this means
      # deciding which baseline is authoritative, not renaming steps.
      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: services/api-server/artifacts/benchmarks/current
      
      - name: Download baseline artifacts
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: services/api-server/artifacts/benchmarks/baseline
      
      - name: Install Python for validation script
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install criterion-cargo-bench-json
          pip install pandas
      
      - name: Validate benchmark regression
        run: |
          python scripts/validate_performance_regression.py \
            --baseline services/api-server/benches/criterion-baseline \
            --current services/api-server/target/criterion \
            --output services/api-server/performance_validation.json
          cat services/api-server/performance_validation.json
      
      - name: Check if regression was detected
        id: validation
        working-directory: services/api-server
        run: |
          RECOMMENDATION=$(jq -r '.recommendation' performance_validation.json)
          echo "recommendation=$RECOMMENDATION" >> $GITHUB_OUTPUT
  
      - name: Fail on performance regression
        if: steps.validation.outputs.recommendation == 'BLOCKED'
        run: |
          echo "❌ Performance regression detected! Please optimize before merging."
          exit 1
      
      - name: Pass if no significant regression
        if: steps.validation.outputs.recommendation != 'BLOCKED'
        run: |
          echo "✅ No significant performance regression detected."
          echo "Recommendation: ${{ steps.validation.outputs.recommendation }}"

  # ============================================================
  # Job 4: Refresh the committed Criterion baseline (manual only)
  # ============================================================
  # The gate in ci.yml compares against benches/criterion-baseline, which was
  # captured on a developer machine and is ~2x faster than shared runners, so
  # every run reported a phantom BLOCKED regression. Run this dispatch job to
  # recapture the estimates on CI hardware, download the artifact, and commit
  # it over services/api-server/benches/criterion-baseline/.
  refresh-criterion-baseline:
    name: Refresh committed Criterion baseline (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks to regenerate estimates
        working-directory: services/api-server
        run: cargo bench -p fms-benches --bench simd_json_benchmarks

      - name: Package refreshed baseline
        working-directory: services/api-server
        run: |
          mkdir -p refreshed-baseline
          for estimates in target/criterion/*/new/estimates.json; do
            name="$(basename "$(dirname "$(dirname "$estimates")")")"
            mkdir -p "refreshed-baseline/$name/new"
            cp "$estimates" "refreshed-baseline/$name/new/estimates.json"
          done
          find refreshed-baseline -type f

      - name: Upload refreshed baseline
        uses: actions/upload-artifact@v4
        with:
          name: criterion-baseline-refresh
          path: services/api-server/refreshed-baseline/
          if-no-files-found: error
