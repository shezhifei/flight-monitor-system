[package]
name = "rust_sse"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "rust_sse"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
dashmap = "6.0"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
