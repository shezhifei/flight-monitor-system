groups:
  - name: fms-slo
    interval: 30s
    rules:
      - alert: FmsApiAvailabilityLow
        expr: |
          sum(rate(fms_http_requests_total[5m])) > 0
          and
          (
            1 - (
              sum(rate(fms_http_requests_total{status=~"5.."}[5m]))
              /
              sum(rate(fms_http_requests_total[5m]))
            )
          ) < 0.995
        for: 10m
        labels:
          severity: critical
          service: rust-api
        annotations:
          summary: FMS API availability is below 99.5%
          description: The five-minute API success ratio has remained below the availability SLO for 10 minutes.
          runbook_url: docs/observability/ALERT_RESPONSE.md#fmsapiavailabilitylow

      - alert: FmsWriteLatencyHigh
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(fms_http_request_duration_seconds_bucket{route=~"POST .*|PUT .*|DELETE .*"}[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: rust-api
        annotations:
          summary: FMS API write p99 latency is above two seconds
          description: Mutating API requests have exceeded the write-latency SLO for 10 minutes.
          runbook_url: docs/observability/ALERT_RESPONSE.md#fmswritelatencyhigh

      - alert: FmsOutboxBacklogHigh
        expr: sum(fms_outbox_pending_events) >= 100
        for: 5m
        labels:
          severity: critical
          service: rust-api
        annotations:
          summary: FMS outbox backlog is above the operational limit
          description: At least 100 unpublished outbox events have remained pending for five minutes.
          runbook_url: docs/observability/ALERT_RESPONSE.md#fmsoutboxbackloghigh

      # --- AI agent SLO alerts (Task J2); conservative warning starts ---

      - alert: FmsAiUngroundedSpike
        expr: increase(fms_ai_errors_total{type="ungrounded"}[15m]) > 10
        for: 5m
        labels:
          severity: warning
          service: ai-sidecar
        annotations:
          summary: Too many ungrounded answers degraded by the evidence-coverage hook
          description: More than 10 final answers cited identifiers without tool evidence in the last 15 minutes.
          runbook_url: docs/observability/ALERT_RESPONSE.md#fmsaiungroundedspike

      - alert: FmsAiSidecarDown
        expr: up{job="fms-ai-sidecar"} == 0
        for: 2m
        labels:
          severity: warning
          service: ai-sidecar
        annotations:
          summary: AI sidecar scrape target is down
          description: Prometheus has not been able to scrape the fms-ai-sidecar job for two minutes.
          runbook_url: docs/observability/ALERT_RESPONSE.md#fmsaisidecardown

      - alert: FmsAiBudgetExhausted
        expr: |
          (
            sum(rate(fms_ai_run_stops_total{reason="budget_exhausted"}[15m]))
            /
            sum(rate(fms_ai_run_stops_total[15m]))
          ) > 0.05
          and
          sum(rate(fms_ai_run_stops_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: ai-sidecar
        annotations:
          summary: More than 5% of agent runs stop on consecutive tool failures
          description: The budget_exhausted share of finished tool-loop runs has stayed above 5% for 15 minutes.
          runbook_url: docs/observability/ALERT_RESPONSE.md#fmsaibudgetexhausted

      - alert: FmsAiFirstProgressSlow
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(fms_ai_first_progress_seconds_bucket[15m])) by (le)
          ) > 3
        for: 15m
        labels:
          severity: warning
          service: ai-sidecar
        annotations:
          summary: Time to first agent progress is above the alert threshold
          description: The p95 time-to-first-progress of agent runs has exceeded three seconds for 15 minutes.
          runbook_url: docs/observability/ALERT_RESPONSE.md#fmsaifirstprogressslow

      - alert: FmsSseConnectionSaturation
        expr: fms_sse_connections_active / fms_sse_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          service: rust-api
        annotations:
          summary: FMS SSE connections are above 80% of the configured cap
          description: Active SSE connections have remained above 80% of fms_sse_max_connections for five minutes.
          runbook_url: docs/observability/ALERT_RESPONSE.md#fmssseconnectionsaturation
