map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

variables_hash_bucket_size 128;

upstream rust_api {
    least_conn;
    server rust-api:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream flight_monitor_flowable {
    server flowable:8080;
    keepalive 8;
}

include /etc/nginx/operator_mode/*.conf;

# --- Rollback Control: Four-Level Priority ---
#
# Priority order (highest to lowest):
#   1. Global operator default from mounted config file
#   2. Per-request header override (X-Force-Python header)
#   3. Per-request cookie override (force_python cookie)
#   4. Approved-route default (Rust for approved paths)
#
# Requirements:
#   - Global rollback must require no image rebuild, at most an nginx reload
#   - Operator can force ALL approved traffic to Python by editing the mounted
#     operator_mode/00-operator_cutover_mode.conf file and reloading nginx
#   - Per-request overrides are lower priority than global operator intent
#

# Level 2: Per-request emergency override via X-Force-Python header
# X-Force-Python: 1 → route to Python (lower priority than operator default)
map $http_x_force_python $force_python_by_header {
    default   "";
    "1"       "1";
    "true"    "1";
    "yes"     "1";
}

# Level 3: Per-request cookie override
# force_python=1 → route to Python for this request
map $cookie_force_python $force_python_by_cookie {
    default   "";
    "1"       "1";
}

# Level 4: Final backend selector — operator default wins first, then header, then cookie, then default
# Priority: operator_default > force_python_header > force_python_cookie > approved-route default
map "$operator_backend_default:$force_python_by_header:$force_python_by_cookie" $dual_backend_pool {
    # Global operator rollback to Python (highest priority)
    "~^flight_monitor_api:" flight_monitor_api;
    # Per-request header forces Python
    "~^[^:]+:1:"           flight_monitor_api;
    # Per-request cookie forces Python
    "~^[^:]+:[^:]*:1$"     flight_monitor_api;
    # Default: use operator-configured backend
    default                $operator_backend_default;
}

# Method-aware ownership split for routes that share a URI with write traffic.
map "$request_method:$uri" $auth_roles_backend_pool {
    default                 flight_monitor_api;
    "GET:/api/v2/auth/roles"  $dual_backend_pool;
    "HEAD:/api/v2/auth/roles" $dual_backend_pool;
}

map "$request_method:$uri" $auth_users_backend_pool {
    default                 flight_monitor_api;
    "GET:/api/v2/auth/users"  $dual_backend_pool;
    "HEAD:/api/v2/auth/users" $dual_backend_pool;
}

map "$request_method:$uri" $auth_user_detail_backend_pool {
    default                              flight_monitor_api;
    ~^GET:/api/v2/auth/users/[^/]+$      $dual_backend_pool;
    ~^HEAD:/api/v2/auth/users/[^/]+$     $dual_backend_pool;
}

map "$request_method:$uri" $auth_admin_permission_templates_backend_pool {
    default                                          flight_monitor_api;
    "GET:/api/v2/auth/admin/permission-templates"    $dual_backend_pool;
    "HEAD:/api/v2/auth/admin/permission-templates"   $dual_backend_pool;
}

map "$request_method:$uri" $auth_admin_permission_template_detail_backend_pool {
    default                                                    flight_monitor_api;
    ~^GET:/api/v2/auth/admin/permission-templates/[^/]+$      $dual_backend_pool;
    ~^HEAD:/api/v2/auth/admin/permission-templates/[^/]+$     $dual_backend_pool;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 100m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http: https: ws: wss:" always;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    location = /flowable-rest {
        return 301 /flowable-rest/;
    }

    location /flowable-rest/ {
        proxy_pass http://flight_monitor_flowable/flowable-rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # =========================================================================
    # PHASE 1 CUTOVER: APPROVED EXACT-PATH ROUTES
    # =========================================================================
    # The following routes are approved for Rust cutover:
    #   - GET /api/v2/health/ping  (stateless health check)
    #   - GET /api/v2/flights/search (read-only flight search)
    #
    # All other routes remain on Python until their phase validation is complete.
    # =========================================================================

    # Block public scrape of Prometheus metrics at the edge.
    # Prometheus scrapes rust-api:8080/metrics on the internal Docker network.
    location = /metrics {
        return 404;
    }

    location = /api/v2/metrics {
        return 404;
    }

    # Phase 1 Cutover: Health check → Rust (with rollback to Python)
    location = /api/v2/health/ping {
        proxy_pass http://$dual_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 1 Cutover: Flight search → Rust (with rollback to Python)
    location = /api/v2/flights/search {
        proxy_pass http://$dual_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # PHASE 2 CUTOVER: CORE READ MODEL DOMAINS
    # =========================================================================
    # All operator dashboard data now comes from Rust.
    # Rust has full implementations of both read and write endpoints.
    # Phase 2 validates read-path parity; Phase 3 validates write-path parity.
    #
    # Rollback: operator_mode/00-operator_cutover_mode.conf -> flight_monitor_api, then nginx reload.
    # Per-request override: X-Force-Python: 1 or force_python=1
    # =========================================================================

    # Phase 2.1: Flights (read + write — Rust has full implementation)
    location ^~ /api/v2/flights {
        proxy_pass http://$dual_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 2.2: KPI dashboard
    location ^~ /api/v2/kpi/ {
        proxy_pass http://$dual_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 2.3: Anomalies
    location ^~ /api/v2/anomalies {
        proxy_pass http://$dual_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 2.4: Archive
    location ^~ /api/v2/archive/ {
        proxy_pass http://$dual_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 2.4: Archive (alternate path)
    location ^~ /api/v2/archived/ {
        proxy_pass http://$dual_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
