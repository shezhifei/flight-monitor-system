    # =========================================================================
    # DEFERRED ROUTES (Phase 3+)
    # =========================================================================
    # The following routes are NOT yet approved for Rust cutover:
    #   - /api/v2/auth/          (Phase 3 - write path validation needed)
    #   - /api/v2/todos/         (Phase 3 - write path validation needed)
    #   - /api/v2/system/        (Phase 3 - write path validation needed)
    #   - /api/v2/sse/stream     (Phase 4 - needs topic audit gate)
    #   - /api/v2/ai/            (Phase 5 - AI sidecar)
    #
    # These routes will fall through to the default Python backend below.
    # =========================================================================

    # SSE stats and other non-stream SSE endpoints → Python (admin ops)
    location ^~ /api/v2/sse/ {
        proxy_pass http://flight_monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
