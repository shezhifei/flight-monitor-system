map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ============================================================================
# TLS 终结（强烈建议启用）
#
# 下方 HTTP server 块为明文回退。生产环境必须在本配置之前存在 TLS 终结层
# （如 Caddy / 云 LB），或取消注释以下 443 server 块并挂载证书：
#   volumes:
#     - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
#     - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
#   ports:
#     - "443:443"
# 启用后可将明文 server 块中的 location 全部改为 301 跳转 https。
# ============================================================================
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name _;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers on;
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
#     # 复用与下方 HTTP server 块相同的 location 配置（建议提取为 conf 片段 include）。
# }

upstream rust_api {
    least_conn;
    server rust-api:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    # 警告：此 server 块为明文 HTTP。生产部署时，本端口前面必须存在
    # TLS 终结层（Caddy / 云 LB / 上方注释的 443 块），否则凭据与会话
    # 可被中间人嗅探。
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;
    client_body_buffer_size 128k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self' https: wss:" always;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 300s;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;

    gzip on;
    gzip_types application/json text/event-stream;
    gzip_min_length 256;

    location /api/v2/sse/ {
        proxy_pass http://rust_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Block public scrape of Prometheus metrics. Prometheus scrapes
    # rust-api:8080/metrics on the internal Docker network, not via the edge.
    location = /metrics {
        return 404;
    }

    location = /api/v2/metrics {
        return 404;
    }

    location /api/v2/ {
        proxy_pass http://rust_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /frontend/ {
        proxy_pass http://rust_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 301 /frontend/html/login.html;
    }

    location /health {
        proxy_pass http://rust_api/api/v2/health/ping;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /internal/ai/ {
        return 404;
    }

    location /api/v2/internal/ {
        return 404;
    }
}
