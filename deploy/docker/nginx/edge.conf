map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream rust_api {
    least_conn;
    server rust-api:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;
    client_body_buffer_size 128k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self' https: wss:" always;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 300s;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;

    gzip on;
    gzip_types application/json text/event-stream;
    gzip_min_length 256;

    location /api/v2/sse/ {
        proxy_pass http://rust_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Block public scrape of Prometheus metrics. Prometheus scrapes
    # rust-api:8080/metrics on the internal Docker network, not via the edge.
    location = /metrics {
        return 404;
    }

    location = /api/v2/metrics {
        return 404;
    }

    location /api/v2/ {
        proxy_pass http://rust_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /frontend/ {
        proxy_pass http://rust_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 301 /frontend/html/login.html;
    }

    location /health {
        proxy_pass http://rust_api/api/v2/health/ping;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /internal/ai/ {
        return 404;
    }

    location /api/v2/internal/ {
        return 404;
    }
}
