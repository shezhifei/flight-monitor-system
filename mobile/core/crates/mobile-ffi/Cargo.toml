[package]
name = "mobile_ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "flutter_rust_bridge facade over mobile-core. Forwarding only, no business logic."

[lib]
crate-type = ["cdylib", "rlib"]

# frb's #[frb(...)] macro emits cfg(frb_expand) markers during codegen expansion.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(frb_expand)"] }

[dependencies]
mobile-core = { path = "../mobile-core" }
flutter_rust_bridge = "=2.12.0"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
