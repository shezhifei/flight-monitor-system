[package]
name = "fms-mq-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[lib]
name = "fms_mq_gateway"
path = "src/lib.rs"

[dependencies]
actix-web = "4"
async-trait = "0.1"
env_logger = "0.11"
log = "0.4"
metrics = "0.24"
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }
rocketmq-client-rust = { path = "../../libs/vendor/rocketmq-rust/rocketmq-client", optional = true }
rocketmq-common = { path = "../../libs/vendor/rocketmq-rust/rocketmq-common", optional = true }
rocketmq-rust = { path = "../../libs/vendor/rocketmq-rust/rocketmq", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[features]
default = []
rocketmq-backend = ["rocketmq-client-rust", "rocketmq-common", "rocketmq-rust"]

[dev-dependencies]
actix-rt = "2"
