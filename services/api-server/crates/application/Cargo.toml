[package]
name = "fms-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 仅供其他 crate 的测试引用 test_support 模块；生产构建不启用。
test-support = []

[dependencies]
fms-domain = { path = "../domain" }
fms-runtime = { path = "../runtime" }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
pgwire-replication = { workspace = true }

# Validation
validator = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
lettre = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
csv = "1.3"
metrics = "0.24"
encoding_rs = "0.8"
calamine = "0.36"
pdf-extract = "0.12"
quick-xml = "0.41"
zip = "2"
futures-util = "0.3"
ts-rs = { workspace = true, features = ["chrono"] }

# Auth (used by auth_service)
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }

dashmap = { workspace = true }
async-trait = { workspace = true }
trait-variant = { workspace = true }
lru = "0.12"

[dev-dependencies]
# 自引用 dev-dependency：tests/ 下的集成测试编译 lib 时不带 cfg(test)，
# 需借这条边把 test-support 特性开起来（与 api/server 的 dev-deps 同一口径）。
fms-application = { path = ".", features = ["test-support"] }
fms-infrastructure = { path = "../infrastructure" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
