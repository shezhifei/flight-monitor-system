# cargo-deny configuration for Flight Monitor System
# Initial baseline — run with `cargo deny check` in CI.
# Starts lenient on duplicate versions and wildcards to avoid
# blocking builds while the dependency graph is being cleaned up.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
# The current Flowable/RocketMQ/Actix graph pins a handful of transitive
# advisories for which no compatible upstream release exists yet. The CI
# cargo-audit steps carry the same explicit exceptions; keep this list in the
# shared cargo-deny policy so both gates report the same decision.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0363",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0185",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0190",
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0258",
]
# cargo-audit reports these as warnings; do not make a transitive yanked
# release a hard build failure while upstream dependency owners migrate.
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
    "CDDL-1.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
